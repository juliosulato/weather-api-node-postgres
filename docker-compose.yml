version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d weather_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - weather_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    env_file:
      - .env
      
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/weather_db}
      
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weather_network

  adminer:
    image: adminer:latest
    container_name: weather_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - weather_network

volumes:
  postgres_data:

networks:
  weather_network:
    driver: bridge