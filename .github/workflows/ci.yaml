name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci-quick:
    name: Quick CI (TypeScript & Lint)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/weather_db
      OPENWEATHER_API_KEY: test_key_for_ci
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

  docker-build-test:
    name: Docker Build & Integration Test
    needs: ci-quick
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" > .env
          echo "NODE_ENV=production" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for database..."
          timeout 120 bash -c 'until docker compose exec -T db pg_isready -U user -d weather_db; do sleep 2; done'

          echo "Waiting for app..."
          timeout 180 bash -c 'until curl -f http://localhost:3000/api/v1/health; do sleep 2; done'

      - name: Run database migrations
        run: docker compose exec -T app npx prisma migrate deploy

      - name: Test health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health)
          if [ $response -ne 200 ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Health check passed!"

      - name: Test weather API endpoint
        run: |
          response=$(curl -s -X POST http://localhost:3000/api/v1/weather \
            -H "Content-Type: application/json" \
            -d '{"city": "London", "countryByISO": "GB"}' \
            -w "%{http_code}" -o /tmp/response.json)

          if [ $response -ne 201 ]; then
            echo "Weather API test failed with status $response"
            cat /tmp/response.json
            exit 1
          fi
          echo "Weather API test passed!"

      - name: Test list weather logs
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/weather)
          if [ $response -ne 200 ]; then
            echo "List weather logs failed with status $response"
            exit 1
          fi
          echo "List weather logs passed!"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== App Logs ==="
          docker compose logs app
          echo "=== DB Logs ==="
          docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v

  docker-build-only:
    name: Docker Build (No Integration)
    needs: ci-quick
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: weather-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
